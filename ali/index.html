<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23f3500f'/><text x='50%' y='68%' font-size='55' font-weight='900' fill='white' text-anchor='middle' font-family='sans-serif'>A</text></svg>" />

  <!-- Google Fonts -->

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#f3500f',
              hover: '#ff682e',
              glow: 'rgba(243, 80, 15, 0.4)'
            },
            dark: {
              DEFAULT: '#0a0b12',
              card: 'rgba(20, 23, 36, 0.7)'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            cairo: ['Cairo', 'sans-serif'],
            rajdhani: ['Rajdhani', 'sans-serif']
          }
        }
      }
    };
  </script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
